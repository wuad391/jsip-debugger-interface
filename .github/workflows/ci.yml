name: CI

# Build the project, run the test suite, and check formatting on every push to
# main and every pull request. Uses ocaml/setup-ocaml to install a fresh opam
# switch and the project's dependencies, so the workflow is self-contained --
# no prebuilt image required.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Cancel an in-progress run when a newer commit is pushed to the same PR
# branch — but never on main, where every merge should get its checkmark
# (with ~30-minute cold runs, unconditional cancellation left main's
# history a wall of cancelled runs).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # The TUI is built on bonsai_term, whose v0.18~preview releases (and
      # their Jane Street dependency closure) live in the OxCaml opam
      # repository and build against the OxCaml compiler variant. A cold run
      # compiles the compiler and the closure (~30 min); setup-ocaml caches
      # the switch, deps included.
      #
      # Both repositories are PINNED to commits: setup-ocaml's cache key
      # follows the repositories, and the default opam-repository moves
      # hourly — unpinned, nearly every run missed the cache and spent ~20
      # minutes recompiling dependencies, which (with cancel-in-progress)
      # is why CI seemed to never finish. With stable pins the cache hits
      # and a run takes a few minutes. To pick up new upstream packages,
      # bump the SHAs to the repos' current HEADs.
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-variants.5.2.0+ox
          opam-repositories: |
            ox: https://github.com/oxcaml/opam-repository.git#d65f081024758576f7a848bbd369863e7f7c1e81
            default: https://github.com/ocaml/opam-repository.git#e991f326d5c14546a2a94b24535cd30397ed8b67

      # setup-ocaml's own cache is saved during the setup step, BEFORE the
      # install below runs, and it never re-saves an existing key — so the
      # ~25-minute Jane Street dependency build could never enter it. This
      # second layer snapshots the opam root again after the install: on a
      # hit the install step is a no-op and a run takes minutes. Keyed on
      # the workflow file too, so bumping the repository pins above also
      # refreshes this layer.
      - name: Cache installed dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          # setup-ocaml v3 makes the switch LOCAL to the workspace (_opam);
          # ~/.opam holds only the root metadata and download cache — both
          # paths are needed or the snapshot is hollow
          path: |
            ~/.opam
            _opam
          key:
            deps-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml',
            'dune-project', '*.opam') }}

      # Skipped entirely on an exact cache hit: the key covers the opam
      # file, dune-project and this workflow, so a hit means the restored
      # switch already satisfies the project's dependencies. Running opam
      # anyway invites the solver to churn — on a warm run it chose to
      # downgrade dune-configurator and recompile its 99 dependents.
      - name: Install dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: opam install . --deps-only --with-test

      - name: Build
        run: opam exec -- dune build

      - name: Run tests
        run: opam exec -- dune runtest

      # Runs last so build/test results are always visible even if formatting
      # is off. `dune build @fmt` only checks formatting; locally, `dune fmt`
      # reformats in place.
      - name: Check formatting
        run: opam exec -- dune build @fmt
